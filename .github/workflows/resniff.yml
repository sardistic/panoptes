name: resniff-cameras
# Weekly refresh of the browser-snapshot camera inventories (session-bound sites:
# 511NJ, GoAkamai HI, OKtraffic, TDOT). Commits data/camera_discoveries.json when
# it changes; production picks it up at the next deploy.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
jobs:
  resniff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-web.txt playwright && python -m playwright install --with-deps chromium
      - run: python -m apb.discover.camera_sniff --only nj,hi,ok,tn
      - name: commit if changed
        run: |
          git config user.name "panoptes-bot"
          git config user.email "bot@panoptes.run"
          git add data/camera_discoveries.json
          git diff --cached --quiet || git commit -m "Refresh sniffed camera inventories" && git push
