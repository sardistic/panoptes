// ── live radio ──
// Polls /live/radio/feed every few seconds. Each call the lanes newly saw pings its system's
// antenna (amber when it is a dispatch-weight talkgroup); a scanner polled every 10 min
// reports in bursts, so a burst is spread over the next poll instead of firing at once.
// Each newly transcribed call types out in a bubble on its ~2 km cell (tethered to the
// antenna) or at the antenna, and lands in the "Radio live" strip; an incident thread the
// linker just wrote flashes. Cleaned lines only, as everywhere else.
const RADIO_FEED_MS=5000, radioFx=L.layerGroup().addTo(map), radioSayQ=[], RADIO_MAX_SAY=3;
const radioCalm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let radioCursor=null, radioFeedBusy=false, radioSaying=0, tickCalls=[], tickLast=0, radioTimers=new Set();
const radioLastPing=new Map(), radioLineQ=[]; let radioLineT=null, tickN=0;
let tickMin=false; try{ tickMin=localStorage.getItem('radioTickerMin')==='1'; }catch(_){}
function radioLater(fn,ms){ const t=setTimeout(()=>{ radioTimers.delete(t); fn(); },ms); radioTimers.add(t); }
function radioQuiet(){ radioTimers.forEach(clearTimeout); radioTimers.clear(); radioLineQ.length=0;
  radioField._live.clear(); radioField.redraw();
  clearTimeout(radioLineT); radioLineT=null; radioFx.clearLayers(); radioSayQ.length=0; radioSaying=0; }
function radioPing(at,cls,col){
  if(!at||!map.getBounds().pad(.05).contains(at)) return;
  const sp=col?`<span style="border-color:${col};box-shadow:0 0 8px ${col}99"></span>`:'<span></span>';
  const m=L.marker(at,{icon:L.divIcon({className:'rping'+(cls?' '+cls:''),html:/alert/.test(cls||'')?sp+sp:sp,iconSize:[0,0]}),
    interactive:false,keyboard:false}).addTo(radioFx);
  setTimeout(()=>radioFx.removeLayer(m),/thr|alert/.test(cls||'')?2300:1500);
}
const sysName=id=>(radioRows.find(r=>r.id===id)||{}).system||'radio';
const lineKick=l=>[l.kind,l.type&&l.type!=='other'?String(l.type).replace(/_/g,' '):null].filter(Boolean).join(' · ')||'radio';
function radioSay(l,sysAt){ radioSayQ.push([l,sysAt]); while(radioSayQ.length>8) radioSayQ.shift(); radioSayNext(); }
function radioSayNext(){
  while(radioSaying<RADIO_MAX_SAY&&radioSayQ.length){
    const [l,sysAt]=radioSayQ.shift(), at=l.lat!=null?[l.lat,l.lon]:sysAt;
    if(!at||map.getZoom()<7||!map.getBounds().contains(at)) continue;   // zoomed out: the strip only
    radioSaying++; radioBubble(l,at,l.lat!=null?sysAt:null);
  }
}
function radioBubble(l,at,from){
  const hot=(l.priority||0)>=0.6, col=radioColor(l.type);
  const m=L.marker(at,{icon:L.divIcon({className:'rbub'+(hot?' hot':''),iconSize:[0,0],
    html:`<div class="b" style="border-left-color:${col}"><span class="k" style="color:${col}">${esc(lineKick(l))} · ${esc(l.talkgroup||sysName(l.sys))}</span><span class="t"></span><span class="caret" style="background:${col}"></span></div>`}),
    zIndexOffset:900,keyboard:false}).addTo(radioFx);
  const tether=from&&(from[0]!==at[0]||from[1]!==at[1])
    ?L.polyline([from,at],{color:col,weight:1,opacity:.7,dashArray:'2 4',interactive:false}).addTo(radioFx):null;
  radioPing(at,l.kind==='dispatch'?'alert':'',col);
  const el=m.getElement(), t=el.querySelector('.t'), text=l.line.length>170?l.line.slice(0,168).replace(/\s+\S*$/,'')+'…':l.line;
  el.querySelector('.b').onclick=ev=>{ L.DomEvent.stop(ev); const r=radioRows.find(x=>x.id===l.sys); if(r) openRadio(r); };
  let i=radioCalm?text.length:0;
  const done=()=>{ const c=el.querySelector('.caret'); if(c) c.remove();
    setTimeout(()=>{ el.classList.add('out');
      setTimeout(()=>{ radioFx.removeLayer(m); if(tether) radioFx.removeLayer(tether); radioSaying=Math.max(0,radioSaying-1); radioSayNext(); },800); },6000); };
  if(i>=text.length){ t.textContent=text; done(); return; }
  const tm=setInterval(()=>{ i+=2; t.textContent=text.slice(0,i); if(i>=text.length){ clearInterval(tm); done(); } },
    Math.max(14,Math.min(45,5200/text.length)));                  // a line takes ~1.5-3 s to type
}
// The strip is built once and updated in place: a new line is one new row that slides in;
// the header's counter changes its text only. Nothing re-renders, so nothing flickers.
function radioTickerEl(){
  const el=document.getElementById('radioTicker');
  if(!el.firstChild){
    el.innerHTML=`<div class="h" title="new calls and transcriptions as the radio lanes see them — each scanner's calls replay at their real pace, a few minutes behind (most scanners are checked every 10 min, focus systems every minute)">`
      +`<span class="lv"></span>Radio live<span class="n"></span></div><div class="tls"></div>`;
    el.querySelector('.h').onclick=()=>{ tickMin=!tickMin; try{ localStorage.setItem('radioTickerMin',tickMin?'1':'0'); }catch(_){} radioTickerDraw(); };
  }

}
function radioTickerAdd(l){
  const el=radioTickerEl(), list=el.querySelector('.tls'), row=document.createElement('div');
  row.className='tl'+((l.priority||0)>=0.6?' hot':'');
  row.innerHTML=`<span class="m">${esc(callTime(l.ts))} · ${esc(sysName(l.sys))}${l.talkgroup?' · '+esc(l.talkgroup):''}</span>`
    +`<span class="x"><b style="color:${radioColor(l.type)}">${esc(lineKick(l))}</b> — ${esc(l.line)}</span>`;
  row.title=l.line;
  row.onclick=()=>{ const r=radioRows.find(x=>x.id===l.sys);
    if(l.lat!=null) map.flyTo([l.lat,l.lon],Math.max(map.getZoom(),11));
    else if(r&&r.lat!=null) map.flyTo([r.lat,r.lon],Math.max(map.getZoom(),r.approx?8:10));
    if(r) setTimeout(()=>openRadio(r),l.lat!=null||r.lat!=null?900:0); };

function radioTickerDraw(){
  const el=radioTickerEl(), now=Date.now();
  tickCalls=tickCalls.filter(x=>now-x<600000);
  const on=showRadio&&(tickN>0||tickCalls.length>0);
  el.classList.toggle('on',on); el.classList.toggle('min',tickMin);
  if(!on) return;
  el.querySelector('.lv').classList.toggle('on',now-tickLast<4000);

  const ne=el.querySelector('.n'); if(ne.textContent!==n) ne.textContent=n;

// Lines are released one at a time, a few seconds apart, however many arrive at once.
function radioLineNext(){
  radioLineT=null;
  const nx=radioLineQ.shift(); if(!nx) return;
  const [l,sysAt]=nx; radioTickerAdd(l); tickLast=Date.now();
  const hot=(l.priority||0)>=0.6, disp=l.kind==='dispatch', at=l.lat!=null?[l.lat,l.lon]:sysAt, col=radioColor(l.type);
  radioField.bump(l.sys,sysAt,disp?.45:.2,disp?'disp':'chat',col);
  if(l.lat!=null&&disp) radioField.spot('l'+l.sys+l.id,at,l.priority,Date.now()/1000,col);
  if(at&&map.getZoom()<7) radioPing(at,disp?'alert':'',col);
  radioSay(l,sysAt);
  if(radioLineQ.length) radioLineT=setTimeout(radioLineNext,Math.max(1200,3200-radioLineQ.length*300));
}
// One system's calls are replayed at the pace they were made: a scanner polled every 10
// minutes hands over ten minutes of calls at once; they play back over the next ten
// minutes instead of firing together. At most one ping per system every 0.7 s.
function radioReplay(calls,pos){
  const by=new Map();
  calls.forEach(c=>{ if(pos.has(c.sys)) (by.get(c.sys)||by.set(c.sys,[]).get(c.sys)).push(c); });
  by.forEach((cs,sys)=>{
    cs.sort((a,b)=>a.ts-b.ts);
    const t0=cs[0].ts, span=Math.max(1,cs[cs.length-1].ts-t0);
    const scale=span<RADIO_FEED_MS/1000?(RADIO_FEED_MS/1000)/span:Math.min(1,660/span);
    cs.forEach(c=>radioLater(()=>{
      const now=Date.now(); tickCalls.push(now); tickLast=now;
      const disp=c.weight>=0.8;
      radioField.bump(sys,pos.get(sys),disp?.5:.22,disp?'disp':'chat');
      if(now-(radioLastPing.get(sys)||0)<700) return;
      radioLastPing.set(sys,now); radioPing(pos.get(sys),disp?'hi alert':'');
    },Math.round((c.ts-t0)*scale*1000)+Math.random()*400));
  });
}
async function radioFeed(){
  if(radioFeedBusy||!showRadio||document.hidden) return;
  radioFeedBusy=true;
  try{
    const res=await fetch('/live/radio/feed'+(radioCursor!=null?'?since='+encodeURIComponent(radioCursor):''),{cache:'no-store'});
    if(!res.ok) return;
    const d=await res.json(); radioCursor=d.now;
    const pos=new Map(radioPoints().map(([r,at])=>[r.id,at]));
    radioReplay(d.calls||[],pos);
    (d.lines||[]).sort((a,b)=>a.ts-b.ts).forEach(l=>radioLineQ.push([l,pos.get(l.sys)]));
    while(radioLineQ.length>20) radioLineQ.shift();
    if(radioLineQ.length&&!radioLineT) radioLineNext();
    if((d.threads||[]).length){
      const fresh=new Set(d.threads);
      try{ const r=await fetch('/live/radio/threads',{cache:'no-cache'}); if(r.ok){ radioThreads=await r.json(); drawRadio();
        radioThreads.filter(t=>fresh.has(t.id)&&t.lat!=null).forEach((t,i)=>radioLater(()=>radioPing([t.lat,t.lon],'thr'),i*900)); } }catch(_){}
    }
    radioTickerDraw();
  }catch(_){ }finally{ radioFeedBusy=false; }
}

    +((b.heard||[]).length?'<h4>Heard on dispatch</h4>'+b.heard.map((t,i)=>
      `<div class="row brow" data-h="${i}"><div class="t"><span class="ty">${esc(String(t.type||'call').replace(/_/g,' '))}</span><span class="sev ${t.priority>=0.7?'hot':'lo'}">${esc(callTime(t.ts))}</span></div>`
      +`<div class="loc">${esc(t.system||'')}${t.area?' · '+esc(t.area):''}${t.lat==null?' · not placed':''} · <a href="#" class="rc-hear" data-src="${esc(t.audio)}">▶ hear</a></div></div>`).join(''):'')
    +'<div id="radioAll"></div>';
  if((b.internet||[]).length) html+='<h4>Internet</h4>'+b.internet.map((d,i)=>
    `<div class="row brow" data-n="${i}"><div class="loc" style="margin-top:0;color:var(--txt)">${esc(d.summary)}</div></div>`).join('');
  el.innerHTML=html;
  const hb=document.getElementById('boardHealth'); if(hb) hb.onclick=()=>hb.classList.toggle('open');
  el.querySelectorAll('[data-i]').forEach(r=>r.onclick=()=>openBoardEvent(b.events[+r.dataset.i]));
  el.querySelectorAll('[data-a]').forEach(r=>r.onclick=()=>{ const a=b.anomalies[+r.dataset.a]; if(a.lat!=null) focusSurge({...a,_c:[a.lat,a.lon]}); });
  el.querySelectorAll('[data-r]').forEach(r=>r.onclick=()=>{ const d=b.radio[+r.dataset.r]; if(d.lat!=null) map.flyTo([d.lat,d.lon],d.approx?8:10); });
  el.querySelectorAll('[data-h]').forEach(r=>{ const t=b.heard[+r.dataset.h];
    r.querySelector('.rc-hear').onclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); const p=radioPlayer(); p.src=t.audio; p.play().catch(()=>{}); };
    r.onclick=()=>{ if(t.lat!=null) map.flyTo([t.lat,t.lon],Math.max(map.getZoom(),14)); }; });
  el.querySelectorAll('[data-n]').forEach(r=>r.onclick=()=>{ const d=b.internet[+r.dataset.n]; map.flyTo([d.lat,d.lon],4); });
  drawRadioList();
  loadSitrep();
}
let sitrepAt=0, sitrepText='';
async function loadSitrep(){
  const el=document.querySelector('#sitrep span'); if(!el) return;
  if(sitrepText&&Date.now()-sitrepAt<600000){ el.textContent=sitrepText; return; }
  try{
    const r=await fetch('/live/sitrep');
    if(!r.ok){ const box=document.getElementById('sitrep'); if(box) box.remove(); return; }
    const j=await r.json(); sitrepText=j.text||''; sitrepAt=Date.now();
    const now=document.querySelector('#sitrep span'); if(now) now.textContent=sitrepText;
  }catch(_){ const box=document.getElementById('sitrep'); if(box) box.remove(); }
}
async function openBoardEvent(e){
  map.flyTo([e.lat,e.lon],Math.max(map.getZoom(),12));
  const pop=L.popup({maxWidth:340}).setLatLng([e.lat,e.lon])
    .setContent('<div class="pop"><div class="kick">Event</div><div class="meta">loading…</div></div>').openOn(map);
  let d=null; try{ const r=await fetch('/events/'+encodeURIComponent(e.uid)); if(r.ok) d=await r.json(); }catch(_){}
  if(!map.hasLayer(pop)) return;
  const hist=d&&d.history?d.history.map(x=>x.score):e.spark;
  const src=Object.entries(e.sources||{}).map(([k,v])=>`${esc(k)} ${esc(v)}`).join(' · ');
  const checks=(d&&d.camera_checks||[]).filter(c=>c.cameras).slice(0,2).map(c=>
    `<div class="meta">📷 ${esc(ago(c.ts))} · ${esc(c.supports)}/${esc(c.cameras)} frames support — ${esc(c.verdict||'')}</div>`).join('');
  const oc=d&&d.outcome;
  const scored=oc&&oc.status&&oc.status!=='pending'
    ?`<div class="meta">alert ${esc(oc.status)}${oc.lead_min!=null?` · ${oc.lead_min>0?esc(Math.round(oc.lead_min))+' min ahead of':esc(Math.round(-oc.lead_min))+' min behind'} news`:''}</div>`:'';
  pop.setContent(`<div class="pop"><div class="kick">Event · ${esc(e.trend||'')}</div><div class="ttl">${esc(e.place||'')} ${esc((e.type||'').replace(/_/g,' '))}</div>`
    +`<div class="meta">score ${esc(e.score)} (peak ${esc(e.peak)}) · x${esc(e.count)} · ${esc(e.source_count)} source kinds ${sparkSvg(hist)}</div>`
    +`<div class="meta">${src}</div>`+(e.headline?`<div class="meta">“${esc(e.headline)}”</div>`:'')+checks+scored
    +`<div class="meta"><a href="#" id="evNews">find news near here</a></div></div>`);
  const a=document.getElementById('evNews');
  if(a) a.onclick=ev=>{ ev.preventDefault(); showCorrelation(e.lat,e.lon,Object.keys(e.types||{}).filter(t=>t!=='other').slice(0,3).join(','),''); };
}
async function loadBoard(){
  try{ boardData=await (await fetch('/live/board?limit=12')).json(); }catch(_){ return; }
  const n=document.getElementById('boardN');
  const hot=(boardData.events||[]).filter(e=>!e.standing&&e.rank>=6).length;
  n.textContent=hot?String(hot):'';
  if(boardOn) drawBoard();
}
function setSideTab(board){
  boardOn=board;
  document.getElementById('side').classList.toggle('board',board);
  [['tabFeed',!board],['tabBoard',board]].forEach(([id,on])=>{ const b=document.getElementById(id); b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)); });
  if(board){ drawBoard(); loadBoard(); }
}
document.getElementById('tabFeed').onclick=()=>setSideTab(false);
document.getElementById('tabBoard').onclick=()=>setSideTab(true);

// ── shareable view state ──
// The hash mirrors what is on screen (center/zoom, area, window, type, severity,
// layer toggles) so a URL reproduces the exact view. Written with replaceState so
// panning never floods history; read once at boot before the first load.
const LAYER_BTNS={spikes:'spikesBtn',surges:'surgesBtn',warnings:'warningsBtn',
  env:'envBtn',radar:'radarBtn',goes:'goesBtn',cameras:'camerasBtn',notable:'notableBtn',radio:'radioBtn'};
let urlT=null, urlReady=false;
function readViewState(){
  const q=new URLSearchParams(location.hash.replace(/^#/,''));
  const st={};
  const v=(q.get('v')||'').split(',').map(Number);
  if(v.length===3&&v.every(Number.isFinite)&&Math.abs(v[0])<=90&&Math.abs(v[1])<=180) st.view={lat:v[0],lon:v[1],z:Math.min(19,Math.max(2,v[2]))};
  if(q.has('m')) st.metro=q.get('m').slice(0,80);
  if(q.has('w')) st.window=q.get('w');
  if(q.has('t')) st.type=q.get('t').slice(0,60);
  if(q.has('s')) st.sev=q.get('s');
  if(q.has('l')) st.layers=new Set(q.get('l').split(',').filter(Boolean));
  return st;
}
function writeViewState(){
  if(!urlReady) return;
  const c=map.getCenter(), z=map.getZoom();
  const q=new URLSearchParams();
  q.set('v',`${c.lat.toFixed(4)},${c.lng.toFixed(4)},${Math.round(z*10)/10}`);
  const metro=document.getElementById('metro').value; if(metro&&metro!=='__all__') q.set('m',metro);
  const w=document.getElementById('window').value; if(w!=='0.0833') q.set('w',w);
  const t=document.getElementById('type').value; if(t) q.set('t',t);
  const sv=document.getElementById('minThreat').value; if(sv!=='0') q.set('s',sv);
  const on=Object.entries(LAYER_BTNS).filter(([,id])=>document.getElementById(id).classList.contains('on')).map(([k])=>k);
  q.set('l',on.concat([...hazCats].map(c=>'h.'+c)).join(','));
  const hash='#'+q.toString().replace(/%2C/g,',');
  if(hash!==location.hash) history.replaceState(null,'',hash);
}
function scheduleUrl(){ clearTimeout(urlT); urlT=setTimeout(writeViewState,300); }
['window','type','minThreat','metro'].forEach(id=>document.getElementById(id).addEventListener('change',scheduleUrl));
Object.values(LAYER_BTNS).forEach(id=>document.getElementById(id).addEventListener('click',scheduleUrl));
// re-render (no refetch) when the visible area changes — keeps everything scoped to view
let moveT=null;
map.on('moveend zoomend',()=>{ clearTimeout(moveT); moveT=setTimeout(draw,120); scheduleUrl();
  if(showCameras){ clearTimeout(cameraFetchT); cameraFetchT=setTimeout(loadCameras,260); } });

async function loadMetros(){
  let metros=await withLoad('FEEDS',async()=>{
    try{ return await (await fetch('/live/metros')).json(); }catch(e){ return []; }
  });
  const sel=document.getElementById('metro'); sel.innerHTML='';
  const all=document.createElement('option');
  all.value='__all__'; all.textContent=`NATIONAL OVERVIEW · ${metros.length} FEEDS`;
  sel.appendChild(all);
  metros.forEach(m=>{
    if(m.center) CENTERS[m.metro]=m.center;
    LIVE_METROS.add(m.metro);
    const o=document.createElement('option');
    o.value=m.metro; o.textContent=(m.state?`[${m.state}] `:'')+m.name.slice(0,46);
    sel.appendChild(o);
  });
}

// The server owns the 15-second cadence; browsers receive changed snapshots over one
// long-lived connection. A slow safety refresh preserves service behind SSE-hostile
// proxies and on older browsers without returning to high-frequency polling.
function restartStream(){
  if(eventStream){ eventStream.close(); eventStream=null; }
  if(fallbackTimer){ clearInterval(fallbackTimer); fallbackTimer=null; }
  if(paused) return;
  fallbackTimer=setInterval(load,60000);
  if(!window.EventSource) return;
  const metro=document.getElementById('metro').value;
  const hours=winHours();
  eventStream=new EventSource(`/live/stream?metro=${encodeURIComponent(metro)}&max_age_hours=${encodeURIComponent(hours)}`);
  eventStream.addEventListener('snapshot',event=>{
    try{
      const payload=JSON.parse(event.data);
      if(payload.metro===document.getElementById('metro').value) load(payload.incidents||[]);
    }catch(_){ document.getElementById('status').textContent='STREAM ERROR'; }
  });
  eventStream.addEventListener('upstream_error',()=>{
    document.getElementById('status').textContent='UPSTREAM DEGRADED';
  });
  eventStream.onerror=()=>{
    document.getElementById('status').textContent='RECONNECTING';
  };
}

document.addEventListener('visibilitychange',()=>{
  paused=document.hidden;
  if(paused){
    if(eventStream){ eventStream.close(); eventStream=null; }
    if(fallbackTimer){ clearInterval(fallbackTimer); fallbackTimer=null; }
  }else{
    load(); restartStream(); goesRefresh();
  }
});

(async ()=>{
  const st=readViewState();
  await loadMetros();
  const metroSel=document.getElementById('metro');
  metroSel.value=(st.metro&&LIVE_METROS.has(st.metro))?st.metro:'__all__';   // default: live national overview
  if(st.window&&[...document.getElementById('window').options].some(o=>o.value===st.window)) document.getElementById('window').value=st.window;
  if(st.sev&&[...document.getElementById('minThreat').options].some(o=>o.value===st.sev)) document.getElementById('minThreat').value=st.sev;
  if(st.view) map.setView([st.view.lat,st.view.lon],st.view.z);
  else if(metroSel.value!=='__all__'&&CENTERS[metroSel.value]) map.setView(CENTERS[metroSel.value],12);
  else map.fitBounds(US_BOUNDS,{padding:[20,20]});
  if(st.layers){                       // click each toggle whose state differs from the URL
    Object.entries(LAYER_BTNS).forEach(([k,id])=>{
      const btn=document.getElementById(id);
      if(btn.classList.contains('on')!==st.layers.has(k)) btn.click();
    });
    const cats=st.layers.has('hazards')?Object.keys(HAZ_STYLE)                 // links from before domains
      :[...st.layers].filter(k=>k.startsWith('h.')).map(k=>k.slice(2)).filter(c=>HAZ_STYLE[c]);
    for(const c of cats){ const b=hazBtns.get(c); if(b&&!b.classList.contains('on')) b.click(); }
    syncDomains();
  }
  await load();
  if(st.type){ const sel=document.getElementById('type'); if([...sel.options].some(o=>o.value===st.type)){ sel.value=st.type; draw(); } }
  restartStream();
  urlReady=true; writeViewState();
  loadLooks(); setInterval(()=>{ if(!document.hidden) loadLooks(); },300000);
  loadNotable(); setInterval(()=>{ if(!document.hidden) loadNotable(); },300000);
  loadBoard(); boardTimer=setInterval(()=>{ if(!document.hidden) loadBoard(); },60000);
  loadRadio().then(radioFeed); setInterval(()=>{ if(!document.hidden&&(showRadio||boardOn)) loadRadio(); },120000);
  setInterval(radioFeed,RADIO_FEED_MS); setInterval(radioTickerDraw,1000);
})();
});
