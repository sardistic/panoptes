  # ---- computed by Panoptes -----------------------------------------------------------
  events:
    title: Fused events with lifecycle
    status: enabled
    class: derived
    path: /events
    params: [max_age_hours, limit]
    strip: [summaries, signal_ids]
    licence: Panoptes derived data
    attribution: Panoptes (panoptes.run)
    ttl: 30
  event:
    title: One fused event's history
    status: enabled
    class: derived
    path: "/events/{id}"
    strip: [summaries, signal_ids, camera_checks]
    licence: Panoptes derived data
    attribution: Panoptes (panoptes.run)
    ttl: 30
  emerging:
    title: Emerging clusters
    status: enabled
    class: derived
    path: /live/emerging
    params: [min_count, threat_floor, max_age_hours]
    strip: [summaries, signal_ids, summary, text, title, url, link]
    licence: Panoptes derived data
    attribution: Panoptes (panoptes.run)
    ttl: 30
  surges:
