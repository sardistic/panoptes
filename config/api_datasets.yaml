# Datasets the keyed API (/v1) serves. Each one relays an internal route through a
# short shared cache, so many keyed clients cost about one internal fetch.
#
# status:
#   enabled   served to keys whose tier (or per-key grant) includes it
#   review    NOT served until the owner checks the upstream terms and flips it
# noncommercial: true when the upstream licence forbids commercial use (shown in the catalogue)
#   excluded  never served: upstream terms forbid redistribution, or privacy policy
# class: open (public domain / open licence upstream) | derived (computed by Panoptes)
# path:  internal route; "{id}" is filled from /v1/{dataset}/{id}
# query: fixed query params added to the internal call (callers cannot override them)
# params: query params callers may pass through (anything else is dropped);
#         default [max_age_hours]
# strip: fields removed from every returned object (raw text from restricted sources)
# ttl:   seconds the relay keeps one answer for identical requests
# cost:  request units charged against the daily quota

datasets:
  # ---- open upstreams -----------------------------------------------------------------
  usgs_quakes:
    title: Earthquakes (USGS)
    status: enabled
    class: open
    path: /live/hazards
    query: {source: usgs}
    params: [max_age_hours]
    licence: Public domain (U.S. Government work)
    attribution: U.S. Geological Survey
    ttl: 60
  nws_alerts:
    title: Weather alerts (NWS)
    status: enabled
    class: open
    path: /live/hazards
    query: {source: nws}
