# Never served by the keyed API (listed so the catalogue can say why).
excluded:
  traffic: State 511 feeds are licensed to us per developer key
  cameras: DOT camera images and streams — agency terms; relaying is not ours to grant
  radio_audio: Volunteer scanner audio — owners did not license redistribution
  radio_lines: Per-call transcript lines stay on the map (privacy policy)
  unrest: ACLED licence forbids redistribution
  maritime: AISStream terms forbid redistribution
  rail: Amtrak data is not openly licensed
  social: Social posts belong to their authors / platforms
  news: News headlines and links belong to publishers
  explain_facts_street: Paid model / imagery calls — cost, and imagery terms
